[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "algoding"
version = "0.1.0"
description = "Algorithmic trading research, shadow execution, and paper trading scaffold."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "alpaca-py>=0.42.0",
  "httpx>=0.28.1",
  "matplotlib>=3.9.0",
  "numpy>=2.0.0",
  "datasets>=4.5.0",
  "peft>=0.17.1",
  "plotly>=5.24.0",
  "pymupdf>=1.26.0",
  "reportlab>=4.4.0",
  "scikit-learn>=1.5.2",
  "psycopg[binary]>=3.2.6",
  "sqlalchemy>=2.0.39",
  "transformers>=4.57.6",
  "accelerate>=1.10.1",
  "sentencepiece>=0.2.1",
  "yfinance>=0.2.54",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.5",
  "ruff>=0.11.2",
]
gpu = [
  "bitsandbytes>=0.48.2",
  "torch>=2.8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
