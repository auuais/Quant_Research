services:
  postgres:
    image: postgres:16
    container_name: algoding-postgres
    environment:
      POSTGRES_DB: algoding
      POSTGRES_USER: algoding
      POSTGRES_PASSWORD: algoding
    ports:
      - "5432:5432"
    volumes:
      - ../../postgres/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algoding -d algoding"]
      interval: 10s
      timeout: 5s
      retries: 5

  questdb:
    image: questdb/questdb:8.2.2
    container_name: algoding-questdb
    ports:
      - "8812:8812"
      - "9000:9000"
      - "9009:9009"
    volumes:
      - ../../questdb/data:/var/lib/questdb
    healthcheck:
      test: ["CMD-SHELL", "grep -qi ':2328' /proc/net/tcp /proc/net/tcp6"]
      interval: 10s
      timeout: 5s
      retries: 5
